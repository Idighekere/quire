<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quire-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Quire — A quire for every course | Uniuyo Engineering Materials</title>
    <meta name="description" content="Quire is a community-built library for Uniuyo engineering students — past questions, lecture notes, and textbooks by course. No scattered Drives, no 'ask to resend.'" />
    <meta name="keywords" content="Quire, Uniuyo engineering, past questions, lecture notes, textbooks, University of Uyo, course materials" />
    <meta name="author" content="Quire" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quire — A quire for every course" />
    <meta property="og:description" content="Community-built library for Uniuyo engineering — past questions, lecture notes, and textbooks by course." />
    <meta property="og:image" content="https://usequire.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://usequire.vercel.app" />
    <meta property="og:site_name" content="Quire" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quire — A quire for every course" />
    <meta name="twitter:description" content="Community-built library for Uniuyo engineering — past questions, lecture notes, and textbooks by course." />
    <meta name="twitter:image" content="https://usequire.vercel.app/og-image.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://usequire.vercel.app" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#ff6302" />

    <!-- Preconnect to API + Drive thumbnails (below-fold data) -->
    <link rel="preconnect" href="https://uniuyo-engineering-library-backend.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Structured data for crawlers / AI agents -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Quire",
        "alternateName": "usequire",
        "url": "https://usequire.vercel.app",
        "description": "Community-built library for Uniuyo engineering students — past questions, lecture notes, and textbooks by course.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://usequire.vercel.app/books?courseCode={courseCode}",
          "query-input": "required name=courseCode"
        }
      }
    </script>

    <!-- Preload critical fonts (self-hosted) -->
    <link rel="preload" href="/fonts/DMSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/DMMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Google Analytics - Lazy Loaded -->
    <script>
      // Load Google Analytics after page load to avoid blocking render
      window.addEventListener('load', function() {
        setTimeout(function() {
          var script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-2KTP1SSPF9';
          script.async = true;
          document.head.appendChild(script);
          
          script.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-2KTP1SSPF9');
          };
        }, 100); // Small delay to prioritize main content
      });
    </script>
  </body>
</html>
